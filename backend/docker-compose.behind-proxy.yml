# Chạy production trên VPS ĐÃ CÓ web server khác (nginx/Apache) giữ cổng 80/443.
#
#   docker compose -f docker-compose.behind-proxy.yml up -d
#
# Khác `docker-compose.prod.yml` đúng một điểm: KHÔNG có Caddy. Thay vào đó api gắn vào
# 127.0.0.1:${API_BIND_PORT}, và web server sẵn có trên máy làm reverse proxy + TLS.
#
# Vì sao không dùng bản có Caddy: Caddy cần cổng 80 và 443. Máy đã có nginx giữ hai cổng đó
# thì Caddy không khởi động được, hoặc tệ hơn là làm sập trang đang chạy.
#
# `127.0.0.1:` ở đầu port mapping là BẮT BUỘC, không phải trang trí: thiếu nó thì Docker
# gắn vào 0.0.0.0 và api lộ thẳng ra internet, đi vòng qua nginx lẫn TLS.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?thiếu DB_NAME}
      POSTGRES_USER: ${DB_USER:?thiếu DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?thiếu DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?thiếu REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?thiếu S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?thiếu S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  pronunciation-engine:
    build:
      context: ../pronunciation-engine
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Không đặt hai biến này thì engine tự tính `torch_threads = cores / max_concurrent`.
      # Trên máy 2 vCPU với mặc định `max_concurrent_inference=2`, phép chia ra ĐÚNG MỘT
      # LUỒNG — model 316 triệu tham số chạy forward pass trên một core, còn core kia để
      # trống chờ một request thứ hai có thể không bao giờ tới.
      #
      # Đổi lại: một request dùng cả hai core, hai request thì xếp hàng. Với lưu lượng thấp
      # đây là đánh đổi đúng — độ trễ của người đang chờ quan trọng hơn thông lượng lý thuyết.
      # Khi thật sự có nhiều người dùng đồng thời thì tăng ngược lại, và lúc đó thêm CPU
      # mới là câu trả lời chứ không phải chia nhỏ số luồng.
      PE_MAX_CONCURRENT_INFERENCE: "${PE_MAX_CONCURRENT_INFERENCE:-1}"
      PE_TORCH_THREADS: "${PE_TORCH_THREADS:-2}"
      # off | int8. Xem chú thích đầy đủ trong docker-compose.prod.yml. Tóm tắt: mặc định
      # tắt vì nó ĐỔI ĐIỂM SỐ; bật lên thì `model_version` mang hậu tố `+int8`.
      PE_QUANTIZE: "${PE_QUANTIZE:-off}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      # CHỈ localhost. nginx trên máy gọi vào đây; internet thì không.
      - "127.0.0.1:${API_BIND_PORT:-8090}:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Gọi chính binary: ảnh distroless không có shell/wget/curl để mà gọi.
      test: ["CMD", "/api", "--health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
      PRONUNCIATION_ENGINE_URL: http://pronunciation-engine:8000
      # Lấy từ CÙNG MỘT biến với `PE_MAX_CONCURRENT_INFERENCE` của engine ở trên, để hai
      # con số không thể lệch nhau. Lệch là hỏng âm thầm — xem chú thích trong
      # docker-compose.prod.yml.
      PRONUNCIATION_ENGINE_CONCURRENCY: "${PE_MAX_CONCURRENT_INFERENCE:-1}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pronunciation-engine:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  seed:
    build:
      context: .
      target: seed
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - seed
    logging: *default-logging

  # Dọn audio mẫu không còn dòng CSDL nào trỏ tới.
  #
  #   docker compose -f docker-compose.behind-proxy.yml run --rm prune-samples
  #   docker compose -f docker-compose.behind-proxy.yml run --rm prune-samples -delete
  #
  # File này TỰ CHỨA — KHÔNG ghép thêm `-f docker-compose.yml`. Ghép vào thì compose GỘP
  # `ports` của hai file (gộp chứ không thay thế), kéo theo 5432/6379/9000 và api:8080 từ
  # bản dev: DB với Redis phơi ra internet, api đi vòng qua nginx lẫn TLS, và postgres
  # không khởi động được nếu máy đã có tiến trình khác giữ 5432. Đã xảy ra thật.
  #
  # KHÔNG có `-delete` trong command: mặc định phải là chạy khô. Xem danh sách trước rồi
  # mới xoá — object đã xoá không lấy lại được.
  prune-samples:
    build:
      context: .
      target: prune-samples
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - seed
    logging: *default-logging

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  miniodata:
