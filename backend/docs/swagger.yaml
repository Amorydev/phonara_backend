        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Trạng thái listen drill
      tags:
      - MinimalPairs
  /minimal-pairs/listen/{drill_id}/answer:
    post:
      consumes:
      - application/json
      description: Chấm đúng/sai, trừ heart nếu sai, cập nhật pair_mastery.listen
        (FR-MP-02).
      parameters:
      - description: Drill UUID
        in: path
        name: drill_id
        required: true
        type: string
      - description: Answer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.answerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: is_correct + played_word
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AnswerResultData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "404":
          description: Drill or pair not found
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Nộp đáp án listen drill
      tags:
      - MinimalPairs
  /minimal-pairs/listen/start:
    post:
      consumes:
      - application/json
      description: Tạo phiên nghe phân biệt âm với N cặp ngẫu nhiên, hearts=3 (FR-MP-02,
        S16).
      parameters:
      - description: Drill config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.startDrillRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Drill created with pair list
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.ListenDrillData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Bắt đầu listen drill
      tags:
      - MinimalPairs
  /progress/charts:
    get:
      description: Đọc mastery_snapshots để trả điểm theo thời gian cho sparkline
        (S19/S28).
      parameters:
      - description: week hoặc month
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chart data points
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.ChartsData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Score trend chart
      tags:
      - Progress
  /progress/overview:
    get:
      description: Streak hiện tại, longest_streak, tổng số session (S20).
      produces:
      - application/json
      responses:
        "200":
          description: Overview data
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.ProgressOverviewData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Progress overview
      tags:
      - Progress
  /ready:
    get:
      description: Kiểm tra kết nối DB và Redis. Trả 503 nếu một trong hai không kết
        nối được.
      produces:
      - application/json
      responses:
        "200":
          description: all healthy
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.StatusData'
              type: object
        "503":
          description: degraded
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.StatusData'
              type: object
      summary: Readiness probe
      tags:
      - Probes
  /sessions:
    post:
      consumes:
      - application/json
      description: Mở session luyện tập mới. Server kiểm tra gating (quota freemium).
        Nếu scoring_level không gửi, dùng default_scoring_level của user.
      parameters:
      - description: Session params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.createSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Session created
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SessionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "402":
          description: Quota exceeded
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Tạo practice session
      tags:
      - Sessions
  /sessions/{id}:
    get:
      parameters:
      - description: Session UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Session
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SessionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Lấy thông tin session
      tags:
      - Sessions
  /sessions/{id}/end:
    post:
      description: Đóng session, tính summary_score = avg accuracy từ toàn bộ results.
      parameters:
      - description: Session UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Session ended
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SessionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Kết thúc session
      tags:
      - Sessions
  /sessions/{id}/results:
    post:
      consumes:
      - application/json
      description: |-
        Nhận PA thô từ Azure Speech SDK. Server áp Level scoring (§3b.0a), sanity-check, lưu DB, enqueue recompute Error Profile.
        Idempotent: cùng idempotency_key sẽ không tạo result trùng (BR-QA-03).
        Recording fail (no speech/noise): trả 422, không tạo result, không trừ điểm (BR-SCORE-07).
      parameters:
      - description: Session UUID
        in: path
        name: id
        required: true
        type: string
      - description: PA raw result
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ingestResultRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Result stored
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.IngestResultOutput'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Recording failed / validation error
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Nộp kết quả PA (ingestion)
      tags:
      - Sessions
  /sessions/{id}/results:batch:
    post:
      consumes:
      - application/json
      description: Nộp nhiều PA result cùng lúc khi kết nối mạng khôi phục (NFR-REL-03).
        Tối đa 50 items.
      parameters:
      - description: Session UUID
        in: path
        name: id
        required: true
        type: string
      - description: Batch results
        in: body
        name: body
        required: true
        schema:
          properties:
            results:
              items:
                $ref: '#/definitions/handler.ingestResultRequest'
              type: array
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Batch processed
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.IngestResultOutput'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Batch ingest results (offline sync)
      tags:
      - Sessions
  /sessions/history:
    get:
      description: Trả 50 session gần nhất. Mỗi session có summary_score và signed
        URL để replay audio (consent-gated).
      produces:
      - application/json
      responses:
        "200":
          description: Session history
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.SessionDTO'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Lịch sử practice sessions
      tags:
      - Sessions
  /sessions/in-progress:
    get:
      description: Trả session chưa ended_at để client hiển thị "Tiếp tục 2/8" (S09b).
      produces:
      - application/json
      responses:
        "200":
          description: In-progress session (null nếu không có)
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SessionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Session đang dang dở
      tags:
      - Sessions
  /shadowing/{passage_id}/complete:
    post:
      description: Mark passage completed, trả avg_score tổng kết (S26).
      parameters:
      - description: Passage UUID
        in: path
        name: passage_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Summary
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.ShadowingCompleteData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Hoàn thành passage
      tags:
      - Shadowing
  /shadowing/{passage_id}/progress:
    get:
      description: Trả current_sentence_index, sentence_status (passed/current/skipped),
        avg_score.
      parameters:
      - description: Passage UUID
        in: path
        name: passage_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Progress
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ShadowingProgressDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Tiến độ shadowing passage
      tags:
      - Shadowing
  /shadowing/{passage_id}/sentence-result:
    post:
      consumes:
      - application/json
      description: 'Server áp Level scoring, check ngưỡng 80% (BR-SHAD-02). Trả next_action:
        advance | retry | skip_available.'
      parameters:
      - description: Passage UUID
        in: path
        name: passage_id
        required: true
        type: string
      - description: Sentence PA result
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.sentenceResultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Result
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ShadowingSentenceResult'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Nộp kết quả câu shadowing
      tags:
      - Shadowing
  /speech/token:
    post:
      consumes:
      - application/json
      description: |-
        Cấp short-lived token (30–60s) cho Azure Speech hoặc Speechace.
        Áp dụng 7 lớp phòng thủ chi phí: rate-limit user/IP, freemium quota, cost circuit breaker.
      parameters:
      - description: Token request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.issueTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token issued
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SpeechTokenResult'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "402":
          description: Freemium quota exceeded
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/domain.Response'
        "503":
          description: Cost circuit breaker triggered
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Cấp speech token (§3c)
      tags:
      - Speech
  /streak/check-in:
    post:
      description: Ghi nhận hoạt động hôm nay theo timezone user. Tăng current_streak
        nếu liên tiếp, reset về 1 nếu gián đoạn, cập nhật longest_streak (BR-STREAK-01).
      produces:
      - application/json
      responses:
        "200":
          description: Updated streak
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.StreakDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Streak check-in hàng ngày
      tags:
      - Progress
  /subscription:
    get:
      description: Trả plan (free/premium/exam_pack), status, renews_at, store.
      produces:
      - application/json
      responses:
        "200":
          description: Subscription info
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SubscriptionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Trạng thái subscription
      tags:
      - Subscription
  /subscription/plans:
    get:
      description: Trả pricing plans với giá VND, product_id cho App Store/Google
        Play (BR-PAY-03, S21).
      produces:
      - application/json
      responses:
        "200":
          description: Plans list with VND pricing
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.PlanItem'
                  type: array
              type: object
      summary: Danh sách gói đăng ký
      tags:
      - Subscription
  /subscription/restore:
    post:
      consumes:
      - application/json
      description: Khôi phục entitlement bằng cách re-verify với store (FR-PAY-02).
        Bắt buộc theo App Store / Google Play policy.
      parameters:
      - description: Receipt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.verifyReceiptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Restored subscription
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SubscriptionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Restore Purchase (bắt buộc store)
      tags:
      - Subscription
  /subscription/verify:
    post:
      consumes:
      - application/json
      description: Xác minh receipt từ App Store hoặc Google Play, nâng cấp plan nếu
        hợp lệ (BR-PAY-02).
      parameters:
      - description: Receipt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.verifyReceiptRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated subscription
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.SubscriptionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Invalid receipt
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Verify IAP receipt
      tags:
      - Subscription
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Format: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
