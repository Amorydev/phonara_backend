basePath: /v1
definitions:
  domain.AnswerResultData:
    properties:
      is_correct:
        type: boolean
      played_word:
        type: string
    type: object
  domain.AppConfigData:
    additionalProperties: true
    type: object
  domain.BadgeItem:
    properties:
      code:
        type: string
      criteria_type:
        type: string
      criteria_value:
        type: integer
      description_vi:
        type: string
      earned_at:
        type: string
      icon_url:
        type: string
      id:
        type: string
      name_vi:
        type: string
    type: object
  domain.BadgeListData:
    properties:
      earned:
        items:
          $ref: '#/definitions/domain.BadgeItem'
        type: array
      locked:
        items:
          $ref: '#/definitions/domain.BadgeItem'
        type: array
    type: object
  domain.ChartsData:
    properties:
      period:
        type: string
      points:
        items:
          $ref: '#/definitions/domain.SnapshotPoint'
        type: array
    type: object
  domain.DailyChallengeData:
    properties:
      available:
        type: boolean
      banner_url:
        type: string
      category:
        type: string
      challenge_id:
        type: string
      content_item_id:
        type: string
      date:
        type: string
      message:
        type: string
      moderated:
        type: boolean
      passage_id:
        type: string
      user_status:
        type: string
    type: object
  domain.DailyHistoryItem:
    properties:
      category:
        type: string
      completed_at:
        type: string
      date:
        type: string
      score:
        type: number
      status:
        type: string
    type: object
  domain.DrillStatusData:
    properties:
      correct_count:
        type: integer
      drill_id:
        type: string
      hearts_left:
        type: integer
      status:
        type: string
      total_items:
        type: integer
    type: object
  domain.ExamPromptItem:
    properties:
      exam_type:
        type: string
      id:
        type: string
      part:
        type: string
      prep_seconds:
        type: integer
      prompt_text:
        type: string
      speak_seconds:
        type: integer
    type: object
  domain.ExamReportData:
    properties:
      band_score:
        type: number
      cefr_level:
        type: string
      criteria: {}
      exam_type:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  domain.ExamSessionData:
    properties:
      band_score:
        type: number
      cefr_level:
        type: string
      exam_type:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  domain.LegalDocData:
    properties:
      content_md:
        type: string
      doc_type:
        type: string
      id:
        type: string
      locale:
        type: string
      version:
        type: integer
    type: object
  domain.ListenDrillData:
    properties:
      drill_id:
        type: string
      hearts_left:
        type: integer
      pairs:
        items:
          $ref: '#/definitions/domain.ListenPairItem'
        type: array
      total_items:
        type: integer
    type: object
  domain.ListenPairItem:
    properties:
      audio_a:
        type: string
      audio_b:
        type: string
      pair_id:
        type: string
      word_a:
        type: string
      word_b:
        type: string
    type: object
  domain.MessageData:
    properties:
      message:
        type: string
    type: object
  domain.PARawPayload:
    properties:
      completeness:
        type: number
      fluency:
        type: number
      phonemes:
        items:
          $ref: '#/definitions/domain.PhonemeScore'
        type: array
      prosody:
        type: number
      word_scores:
        items:
          $ref: '#/definitions/domain.WordScore'
        type: array
    type: object
  domain.PhonemeScore:
    properties:
      accuracy:
        type: number
      expected:
        type: string
      phoneme_index:
        type: integer
      said:
        description: 'NBest: what the user actually said'
        type: string
      word_index:
        type: integer
    type: object
  domain.PlanItem:
    properties:
      billing_period:
        type: string
      display_name_vi:
        type: string
      features: {}
      plan:
        type: string
      price_vnd:
        type: integer
      product_id_android:
        type: string
      product_id_ios:
        type: string
    type: object
  domain.ProgressOverviewData:
    properties:
      current_streak:
        type: integer
      last_active_date:
        type: string
      longest_streak:
        type: integer
      total_sessions:
        type: integer
    type: object
  domain.RecommendationItem:
    properties:
      content_id:
        type: string
      difficulty:
        type: integer
      message:
        type: string
      reason:
        type: string
      text:
        type: string
      type:
        type: string
    type: object
  domain.ReportData:
    properties:
      period:
        type: string
      snapshots:
        items:
          $ref: '#/definitions/domain.SnapshotPoint'
        type: array
    type: object
  domain.Response:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
    type: object
  domain.ShadowingCompleteData:
    properties:
      avg_score:
        type: number
      completed:
        type: boolean
      passage_id:
        type: string
    type: object
  domain.SnapshotPoint:
    properties:
      date:
        type: string
      score:
        type: number
    type: object
  domain.StatusData:
    properties:
      db:
        type: string
      redis:
        type: string
      status:
        type: string
    type: object
  domain.SyncData:
    properties:
      profile: {}
      synced_at:
        type: string
    type: object
  domain.TokenData:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      is_guest:
        type: boolean
      refresh_token:
        type: string
      user_id:
        type: string
    type: object
  domain.WordScore:
    properties:
      accuracy:
        type: number
      error_type:
        description: Omission, Insertion, Mispronunciation, None
        type: string
      word:
        type: string
      word_index:
        type: integer
    type: object
  handler.analyticsEventRequest:
    properties:
      event_name:
        type: string
      properties:
        additionalProperties: {}
        type: object
    required:
    - event_name
    type: object
  handler.answerRequest:
    properties:
      chosen_word:
        type: string
      pair_id:
        type: string
    required:
    - chosen_word
    - pair_id
    type: object
  handler.createSessionRequest:
    properties:
      mode:
        enum:
        - word
        - sentence
        - minimal_pair
        - read_word
        - shadowing
        - exam
        type: string
      scoring_level:
        enum:
        - easy
        - medium
        - hard
        type: string
      source:
        enum:
        - recommended
        - free_choice
        - daily
        - onboarding
        type: string
    required:
    - mode
    type: object
  handler.feedbackRequest:
    properties:
      context:
        additionalProperties: {}
        type: object
      message:
        maxLength: 2000
        minLength: 1
        type: string
      type:
        enum:
        - feedback
        - bug
        - support
        type: string
    required:
    - message
    - type
    type: object
  handler.ingestResultRequest:
    properties:
      audio_ref:
        type: string
      content_item_id:
        type: string
      idempotency_key:
        type: string
      minimal_pair_id:
        type: string
      pa_raw:
        $ref: '#/definitions/domain.PARawPayload'
      scoring_level:
        enum:
        - easy
        - medium
        - hard
        type: string
    required:
    - idempotency_key
    - pa_raw
    - scoring_level
    type: object
  handler.issueTokenRequest:
    properties:
      engine:
        enum:
        - azure
        - speechace
        type: string
      session_id:
        type: string
    required:
    - engine
    - session_id
    type: object
  handler.loginRequest:
    properties:
      email:
        type: string
      id_token:
        type: string
      password:
        type: string
      provider:
        enum:
        - email
        - google
        - apple
        type: string
    required:
    - provider
    type: object
  handler.notifPrefsRequest:
    properties:
      practice_reminder:
        properties:
          enabled:
            type: boolean
          time:
            type: string
        type: object
      streak_reminder:
        properties:
          enabled:
            type: boolean
        type: object
    type: object
  handler.privacyRequest:
    properties:
      allow_recording_for_improvement:
        type: boolean
      save_recording_history:
        type: boolean
    type: object
  handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.registerDeviceRequest:
    properties:
      platform:
        enum:
        - ios
        - android
        type: string
      push_token:
        type: string
    required:
    - platform
    - push_token
    type: object
  handler.registerRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      id_token:
        type: string
      password:
        minLength: 8
        type: string
      provider:
        enum:
        - email
        - google
        - apple
        type: string
    required:
    - provider
    type: object
  handler.sentenceResultRequest:
    properties:
      audio_ref:
        type: string
      order_index:
        minimum: 0
        type: integer
      pa_raw:
        $ref: '#/definitions/domain.PARawPayload'
      scoring_level:
        enum:
        - easy
        - medium
        - hard
        type: string
    required:
    - pa_raw
    - scoring_level
    type: object
  handler.startDrillRequest:
    properties:
      count:
        maximum: 20
        minimum: 5
        type: integer
    type: object
  handler.updateMeRequest:
    properties:
      daily_goal_items:
        maximum: 50
        minimum: 1
        type: integer
      default_scoring_level:
        enum:
        - easy
        - medium
        - hard
        type: string
      display_name:
        type: string
      goal:
        enum:
        - communication
        - interview
        - ielts_toeic
        - beginner
        type: string
      level:
        enum:
        - beginner
        - intermediate
        - advanced
        type: string
      target_accent:
        enum:
        - US
        - UK
        type: string
      timezone:
        type: string
    type: object
  handler.verifyReceiptRequest:
    properties:
      receipt:
        type: string
      store:
        enum:
        - app_store
        - google_play
        type: string
    required:
    - receipt
    - store
    type: object
  service.ContentItem:
    properties:
      audio_url_uk:
        type: string
      audio_url_us:
        type: string
      difficulty:
        type: integer
      focus_phonemes:
        items:
          type: string
        type: array
      id:
        type: string
      ipa:
        type: string
      text:
        type: string
      topic:
        type: string
      type:
        type: string
    type: object
  service.ErrorProfileDTO:
    properties:
      overall_score:
        type: number
      phoneme_status:
        items:
          $ref: '#/definitions/service.PhonemeStatus'
        type: array
      skill_status:
        items:
          $ref: '#/definitions/service.SkillStatus'
        type: array
      top_errors:
        items:
          $ref: '#/definitions/service.TopError'
        type: array
    type: object
  service.FixGuideItem:
    properties:
      examples: {}
      id:
        type: string
      is_simplified:
        type: boolean
      media_url:
        type: string
      tongue_position_vi:
        type: string
    type: object
  service.IngestResultOutput:
    properties:
      accuracy:
        type: number
      completeness:
        type: number
      fluency:
        type: number
      item_result_id:
        type: string
      prosody:
        type: number
      trust_flag:
        type: string
    type: object
  service.MinimalPairItem:
    properties:
      audio_a_us:
        type: string
      audio_b_us:
        type: string
      category:
        type: string
      explain_vi:
        type: string
      id:
        type: string
      phoneme_a:
        type: string
      phoneme_b:
        type: string
      word_a:
        type: string
      word_b:
        type: string
    type: object
  service.NotifPrefs:
    properties:
      practice_reminder:
        properties:
          enabled:
            type: boolean
          time:
            type: string
        type: object
      streak_reminder:
        properties:
          enabled:
            type: boolean
        type: object
    type: object
  service.PassageItem:
    properties:
      difficulty:
        type: integer
      id:
        type: string
      sentence_count:
        type: integer
      source:
        type: string
      title:
        type: string
      topic:
        type: string
    type: object
  service.PassageSentenceItem:
    properties:
      id:
        type: string
      ipa:
        type: string
      native_audio_url:
        type: string
      order_index:
        type: integer
      text:
        type: string
    type: object
  service.PhonemeStatus:
    properties:
      attempts:
        type: integer
      mastery:
        type: number
      phoneme:
        type: string
      status:
        type: string
    type: object
  service.PrivacyPrefs:
    properties:
      allow_recording_for_improvement:
        type: boolean
      save_recording_history:
        type: boolean
    type: object
  service.QuotaDTO:
    properties:
      daily_limit:
        type: integer
      is_premium:
        type: boolean
      items_used:
        type: integer
      remaining:
        type: integer
    type: object
  service.SessionDTO:
    properties:
      ended_at:
        type: string
      id:
        type: string
      mode:
        type: string
      scoring_level:
        type: string
      source:
        type: string
      started_at:
        type: string
      summary_score:
        type: number
    type: object
  service.ShadowingProgressDTO:
    properties:
      completed:
        type: boolean
      current_sentence_index:
        type: integer
      passage_avg_score:
        type: number
      passage_id:
        type: string
      sentence_status: {}
    type: object
  service.ShadowingSentenceResult:
    properties:
      can_skip:
        type: boolean
      next_action:
        description: advance | retry | skip_available
        type: string
      passed:
        type: boolean
      score:
        type: number
    type: object
  service.SkillStatus:
    properties:
      mastery:
        type: number
      skill:
        type: string
      status:
        type: string
    type: object
  service.SpeechTokenResult:
    properties:
      engine:
        type: string
      expires_at:
        type: string
      region:
        type: string
      token:
        type: string
    type: object
  service.StreakDTO:
    properties:
      current_streak:
        type: integer
      last_active_date:
        type: string
      longest_streak:
        type: integer
    type: object
  service.SubscriptionDTO:
    properties:
      plan:
        type: string
      renews_at:
        type: string
      status:
        type: string
      store:
        type: string
    type: object
  service.TopError:
    properties:
      l1_tag:
        type: string
      mastery:
        type: number
      phoneme:
        type: string
      status:
        type: string
    type: object
  service.UserProfile:
    properties:
      auth_provider:
        type: string
      created_at:
        type: string
      daily_goal_items:
        type: integer
      default_scoring_level:
        type: string
      display_name:
        type: string
      email:
        type: string
      goal:
        type: string
      id:
        type: string
      is_guest:
        type: boolean
      level:
        type: string
      onboarding_completed:
        type: boolean
      target_accent:
        type: string
      timezone:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: dev@phonara.app
    name: Phonara Team
  description: |-
    Backend API cho ứng dụng luyện phát âm tiếng Anh Phonara.
    Bao gồm: Authentication, Practice Sessions, Error Profile Engine,
    Content, Shadowing, Minimal Pairs, Subscription, Exam (Speechace), Daily Challenge.
  license:
    name: Proprietary
  title: Phonara API
  version: "1.0"
paths:
  /app-config:
    get:
      description: Trả min_version (force-update) và feature flags "Sắp có" (S09b/S22).
      produces:
      - application/json
      responses:
        "200":
          description: Config key-value map
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.AppConfigData'
              type: object
      summary: App configuration flags
      tags:
      - System
  /auth/guest:
    post:
      description: Tạo tài khoản khách tạm thời (BR-FREE-04). Giới hạn tính năng,
        có thể upgrade sau.
      produces:
      - application/json
      responses:
        "201":
          description: Guest tokens
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.TokenData'
              type: object
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Tạo guest user
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Xác thực người dùng qua email/Google/Apple. Trả access_token (15m)
        và refresh_token (7d).
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens issued
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.TokenData'
              type: object
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Đăng nhập
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Revoke refresh token cũ và issue cặp token mới. Client dùng khi
        access_token hết hạn.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New tokens
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.TokenData'
              type: object
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Refresh token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Tạo tài khoản mới qua email/Google/Apple. Tự động tạo error_profile,
        subscription(free), streak_record.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tokens issued
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.TokenData'
              type: object
        "400":
          description: Missing fields
          schema:
            $ref: '#/definitions/domain.Response'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/domain.Response'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/domain.Response'
      summary: Đăng ký tài khoản
      tags:
      - Auth
  /badges:
    get:
      description: Trả earned[] và locked[] với criteria và progress tới badge kế
        tiếp (FR-STREAK-03, S20).
      produces:
      - application/json
      responses:
        "200":
          description: earned and locked badges
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.BadgeListData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Danh sách badges
      tags:
      - Progress
  /coach/profile:
    get:
      description: Trả overall_score, top_errors, phoneme/skill mastery. Dùng cho
        S07 (onboarding), S19 (coach overview).
      produces:
      - application/json
      responses:
        "200":
          description: Error profile
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ErrorProfileDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Error Profile — tổng quan phát âm
      tags:
      - Coach
  /coach/recommendation:
    get:
      description: Rank = severity × frequency × L1_importance × goal_fit (BR-COACH-04).
        Dùng cho S09 hero section.
      produces:
      - application/json
      responses:
        "200":
          description: Recommended content
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.RecommendationItem'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Bài luyện đề xuất
      tags:
      - Coach
  /coach/report:
    get:
      description: Đọc mastery_snapshots để tính trend ↑↓ và sparkline (FR-COACH-05,
        S28).
      parameters:
      - description: 'week hoặc month (default: week)'
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Progress report
          schema:
            allOf:
            - $ref: '#/definitions/domain.Response'
            - properties:
                data:
                  $ref: '#/definitions/domain.ReportData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.Response'
      security:
      - BearerAuth: []
      summary: Báo cáo tiến độ theo tuần/tháng
      tags:
      - Coach
  /content/fix-guide:
    get:
      description: Trả fix guide tiếng Việt cho phoneme/l1_tag. Fallback về simplified
        guide nếu chưa có rich content (BR-L1-02).
      parameters:
      - description: 'IPA phoneme (vd: /θ/)'
        in: query
        name: phoneme
        type: string
      - description: L1 error tag code
        in: query
        name: l1_tag
