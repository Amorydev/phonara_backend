# Vhost nginx cho api.phonara.online — dùng khi VPS đã có nginx phục vụ project khác.
#
# Chép lên VPS:
#   sudo cp deploy/nginx-api.phonara.online.conf /etc/nginx/sites-available/api.phonara.online
#   sudo ln -s /etc/nginx/sites-available/api.phonara.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rồi xin chứng chỉ — certbot tự sửa file này để thêm phần TLS:
#   sudo certbot --nginx -d api.phonara.online
#
# `server_name` khớp CHÍNH XÁC tên miền nên các site đang chạy trên cổng 80 không bị ảnh
# hưởng: nginx định tuyến theo Host header, request tới IP trần hoặc tên miền khác vẫn về
# đúng vhost cũ.

server {
    listen 80;
    listen [::]:80;
    server_name api.phonara.online;

    # Backend chỉ trả JSON và audio, không có form upload lớn — nhưng bản ghi giọng nói
    # đi qua đây. Mặc định nginx là 1 MB, quá nhỏ cho audio WAV vài chục giây.
    client_max_body_size 25M;

    # Chấm phát âm mất tới ~2 giây, và lần đầu sau khi khởi động engine còn lâu hơn vì
    # phải nạp model. Mặc định 60s là đủ, nhưng đặt rõ để không phụ thuộc cấu hình chung
    # của máy — vốn có thể đã bị project khác sửa.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Đường Let's Encrypt dùng để xác minh quyền sở hữu tên miền.
    #
    # Khai tường minh vì cấu hình nginx sẵn có trên máy này đang trả 403 cho đường đó — đo
    # được trước khi cài vhost. Thủ phạm thường là luật chặn file ẩn:
    #
    #     location ~ /\. { deny all; }
    #
    # `.well-known` cũng bắt đầu bằng dấu chấm nên bị chặn nhầm, và certbot thất bại với
    # thông báo khó lần ra nguyên nhân. Khối `location ^~` dưới đây có độ ưu tiên cao hơn
    # mọi biểu thức chính quy, nên nó thắng luật kia.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type "text/plain";
    }

    location / {
        # Cổng này phải khớp API_BIND_PORT trong .env (mặc định 8090).
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Không đệm phản hồi: audio mẫu có thể vài trăm KB, đệm lại chỉ thêm độ trễ.
        proxy_buffering off;
    }

    # Swagger là tài liệu API nội bộ, không để public.
    location /swagger/ {
        return 404;
    }
}
